version: 2

models:
  - name: silver_employee
    description: Cleaned and deduplicated employee data, one row per employee_id.
    columns:

      - name: employee_id
        description: Primary key for the employee, deduplicated to latest version.
        tests:
          - unique
          - not_null

      - name: email
        tests:
          - not_null

      - name: role
        description: Standardized employee role.
        tests:
          - accepted_values:
              values: ['Associate', 'Manager', 'Senior Manager']

      - name: hire_date
        tests:
          - not_null